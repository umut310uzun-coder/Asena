name: Asena APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Projeyi olustur
        run: |
          npx --yes create-expo-app@latest asena --template blank-typescript --yes
          cd asena
          npx expo install expo-speech expo-speech-recognition expo-keep-awake expo-build-properties @react-native-async-storage/async-storage

      - name: Ayarlar (app.json)
        working-directory: asena
        run: |
          node -e '
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const name = (x) => (Array.isArray(x) ? x[0] : x);
          const mine = ["expo-speech-recognition", "expo-build-properties"];
          j.expo.name = "Asena";
          j.expo.slug = "asena";
          j.expo.userInterfaceStyle = "dark";
          j.expo.android = { ...(j.expo.android || {}), package: "com.umut.asena", permissions: ["RECORD_AUDIO"] };
          j.expo.plugins = [
            ...(j.expo.plugins || []).filter((x) => !mine.includes(name(x))),
            ["expo-speech-recognition", {
              microphonePermission: "Asena seni duymak icin mikrofona erismek istiyor.",
              speechRecognitionPermission: "Asena konusmani yaziya cevirmek istiyor.",
              androidSpeechServicePackages: ["com.google.android.googlequicksearchbox"]
            }],
            ["expo-build-properties", { android: { usesCleartextTraffic: true } }]
          ];
          fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
          '

      - name: Dosya src/core/providers.ts
        working-directory: asena
        run: |
          mkdir -p src/core
          cat > src/core/providers.ts <<'ENDFILE'
export type ApiType = "openai" | "anthropic" | "gemini";

export type Provider = {
  id: string;
  name: string;
  type: ApiType;
  baseUrl: string;
  apiKey: string;
  model: string;
  enabled: boolean;
  needsKey: boolean;
  keyUrl?: string;
  custom?: boolean;
};

const p = (x: Omit<Provider, "apiKey" | "enabled" | "needsKey"> & Partial<Provider>): Provider => ({
  apiKey: "",
  enabled: true,
  needsKey: true,
  ...x,
});

export const PRESETS: Provider[] = [
  p({ id: "groq", name: "Groq (Ã¼cretsiz, Ã§ok hÄ±zlÄ±)", type: "openai", baseUrl: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-120b", keyUrl: "https://console.groq.com/keys" }),
  p({ id: "gemini", name: "Google Gemini (Ã¼cretsiz)", type: "gemini", baseUrl: "https://generativelanguage.googleapis.com/v1beta", model: "gemini-flash-latest", keyUrl: "https://aistudio.google.com/apikey" }),
  p({ id: "cerebras", name: "Cerebras (Ã¼cretsiz)", type: "openai", baseUrl: "https://api.cerebras.ai/v1", model: "gpt-oss-120b", keyUrl: "https://cloud.cerebras.ai" }),
  p({ id: "mistral", name: "Mistral (Ã¼cretsiz)", type: "openai", baseUrl: "https://api.mistral.ai/v1", model: "mistral-small-latest", keyUrl: "https://console.mistral.ai/api-keys" }),
  p({ id: "openrouter", name: "OpenRouter (Ã¼cretsiz modeller)", type: "openai", baseUrl: "https://openrouter.ai/api/v1", model: "openrouter/free", keyUrl: "https://openrouter.ai/keys" }),
  p({ id: "github", name: "GitHub Models (Ã¼cretsiz)", type: "openai", baseUrl: "https://models.github.ai/inference", model: "openai/gpt-4.1-mini", keyUrl: "https://github.com/settings/tokens" }),
  p({ id: "claude", name: "Claude (Anthropic, Ã¼cretli)", type: "anthropic", baseUrl: "https://api.anthropic.com/v1", model: "claude-haiku-4-5", keyUrl: "https://console.anthropic.com/settings/keys" }),
  p({ id: "openai", name: "ChatGPT / OpenAI (Ã¼cretli)", type: "openai", baseUrl: "https://api.openai.com/v1", model: "", keyUrl: "https://platform.openai.com/api-keys" }),
  p({ id: "deepseek", name: "DeepSeek", type: "openai", baseUrl: "https://api.deepseek.com/v1", model: "deepseek-chat", keyUrl: "https://platform.deepseek.com/api_keys" }),
];

export function mergeWithPresets(saved: Provider[] | null): Provider[] {
  if (!saved || !Array.isArray(saved)) return PRESETS.map((x) => ({ ...x }));
  const ids = new Set(saved.map((s) => s.id));
  const kept = saved.map((s) => {
    const pre = PRESETS.find((x) => x.id === s.id);
    if (!pre) return s;
    return { ...pre, apiKey: s.apiKey ?? "", model: s.model ?? pre.model, enabled: s.enabled ?? true };
  });
  return [...kept, ...PRESETS.filter((x) => !ids.has(x.id)).map((x) => ({ ...x }))];
}

export function isUsable(x: Provider): boolean {
  return x.enabled && !!x.model.trim() && !!x.baseUrl.trim() && (!x.needsKey || !!x.apiKey.trim());
}
ENDFILE

      - name: Dosya src/core/brain.ts
        working-directory: asena
        run: |
          cat > src/core/brain.ts <<'ENDFILE'
import { Provider, isUsable } from "./providers";

export type Message = { role: "user" | "model"; text: string; local?: boolean; via?: string };

const SYSTEM = "Sen Asena'sin. Umut'un kisisel yapay zeka asistanissin. Iron Man'deki Jarvis gibi zeki, sakin, hafif esprili ve sadiksin. Her zaman Turkce konus. Cevaplarin sesli okunacak: kisa ve dogal cumleler kur. Madde isareti, emoji, markdown ya da kod blogu kullanma.";

type Turn = { role: "user" | "assistant"; text: string };

function toTurns(history: Message[]): Turn[] {
  const out: Turn[] = [];
  for (const m of history.filter((x) => !x.local).slice(-20)) {
    const role = m.role === "user" ? "user" : "assistant";
    const last = out[out.length - 1];
    if (last && last.role === role) last.text += "\n" + m.text;
    else out.push({ role, text: m.text });
  }
  while (out.length && out[0].role !== "user") out.shift();
  return out;
}

async function callOne(x: Provider, turns: Turn[]): Promise<string> {
  const model = x.model.trim();
  const url = x.baseUrl.trim().replace(/\/+$/, "");
  
  if (x.type === "anthropic") {
    const res = await fetch(`${url}/messages`, {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": x.apiKey.trim(), "anthropic-version": "2023-06-01" },
      body: JSON.stringify({ model, max_tokens: 1024, system: SYSTEM, messages: turns.map((t) => ({ role: t.role, content: t.text })) }),
    });
    const data: any = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || "hata");
    return (data?.content ?? []).filter((b: any) => b?.type === "text").map((b: any) => b.text).join("").trim();
  }
  
  if (x.type === "gemini") {
    const res = await fetch(`${url}/models/${model}:generateContent`, {
      method: "POST",
      headers: { "content-type": "application/json", "x-goog-api-key": x.apiKey.trim() },
      body: JSON.stringify({ system_instruction: { parts: [{ text: SYSTEM }] }, contents: turns.map((t) => ({ role: t.role === "user" ? "user" : "model", parts: [{ text: t.text }] })) }),
    });
    const data: any = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || "hata");
    return (data?.candidates?.[0]?.content?.parts ?? []).map((q: any) => q?.text ?? "").join("").trim();
  }
  
  const res = await fetch(`${url}/chat/completions`, {
    method: "POST",
    headers: { "content-type": "application/json", Authorization: `Bearer ${x.apiKey.trim()}` },
    body: JSON.stringify({ model, messages: [{ role: "system", content: SYSTEM }, ...turns.map((t) => ({ role: t.role, content: t.text }))] }),
  });
  const data: any = await res.json();
  if (!res.ok) throw new Error(data?.error?.message || "hata");
  return (data?.choices?.[0]?.message?.content ?? "").trim();
}

export async function ask(history: Message[], providers: Provider[]): Promise<{ text: string; via: string }> {
  const turns = toTurns(history);
  const usable = providers.filter(isUsable);
  if (!usable.length) throw new Error("Ayarlar'da en az bir yapay zekayÄ± ac.");
  const errors: string[] = [];
  for (const x of usable) {
    try {
      const text = await callOne(x, turns);
      if (text) return { text, via: x.name };
      errors.push(`${x.name}: bos cevap`);
    } catch (e: any) {
      errors.push(`${x.name}: ${e?.message || "hata"}`);
    }
  }
  throw new Error("Hicbir yapay zeka cevap vermedi.");
}
ENDFILE

      - name: Dosya App.tsx
        working-directory: asena
        run: |
          cat > App.tsx <<'ENDFILE'
import { useEffect, useRef, useState } from "react";
import { View, Text, TextInput, Pressable, ScrollView, StyleSheet, Modal, ActivityIndicator, StatusBar, KeyboardAvoidingView } from "react-native";
import * as Speech from "expo-speech";
import { ExpoSpeechRecognitionModule, useSpeechRecognitionEvent } from "expo-speech-recognition";
import { useKeepAwake } from "expo-keep-awake";
import AsyncStorage from "@react-native-async-storage/async-storage";
import { ask, Message } from "./src/core/brain";
import { Provider, mergeWithPresets, isUsable } from "./src/core/providers";

const KEY = "asena-v2";

export default function App() {
  useKeepAwake();
  const [providers, setProviders] = useState<Provider[]>(mergeWithPresets(null));
  const [voice, setVoice] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const [messages, setMessages] = useState<Message[]>([]);
  const [listening, setListening] = useState(false);
  const [thinking, setThinking] = useState(false);
  const [partial, setPartial] = useState("");
  const [input, setInput] = useState("");
  const messagesRef = useRef<Message[]>([]);
  const scrollRef = useRef<ScrollView>(null);

  useEffect(() => {
    (async () => {
      let saved: any = null;
      try { saved = JSON.parse((await AsyncStorage.getItem(KEY)) ?? "null"); } catch {}
      const merged = mergeWithPresets(saved?.providers ?? null);
      setProviders(merged);
      setVoice(saved?.voice ?? "");
      if (!merged.some(isUsable)) setShowSettings(true);
    })();
  }, []);

  function push(m: Message) {
    messagesRef.current = [...messagesRef.current, m];
    setMessages(messagesRef.current);
    setTimeout(() => scrollRef.current?.scrollToEnd({ animated: true }), 50);
  }

  function speak(text: string, v = voice) {
    Speech.stop();
    Speech.speak(text, { language: "tr-TR", voice: v || undefined, rate: 1.0, pitch: 1.0 });
  }

  async function send(text: string) {
    const t = text.trim();
    if (!t || thinking) return;
    push({ role: "user", text: t });
    setThinking(true);
    try {
      const r = await ask(messagesRef.current, providers);
      push({ role: "model", text: r.text, via: r.via });
      speak(r.text);
    } catch (e: any) {
      push({ role: "model", text: "Hata: " + (e?.message ?? "bilinmeyen"), local: true });
    } finally {
      setThinking(false);
    }
  }

  const sendRef = useRef(send);
  sendRef.current = send;

  useSpeechRecognitionEvent("start", () => setListening(true));
  useSpeechRecognitionEvent("end", () => setListening(false));
  useSpeechRecognitionEvent("result", (e) => {
    const tr = e.results[0]?.transcript ?? "";
    if (e.isFinal) { setPartial(""); sendRef.current(tr); } else setPartial(tr);
  });
  useSpeechRecognitionEvent("error", (e) => {
    setListening(false);
    setPartial("");
    if (e.error !== "no-speech" && e.error !== "aborted") push({ role: "model", text: "Mikrofon hatasi: " + e.message, local: true });
  });

  async function toggleMic() {
    if (listening) { ExpoSpeechRecognitionModule.stop(); return; }
    Speech.stop();
    const perm = await ExpoSpeechRecognitionModule.requestPermissionsAsync();
    if (!perm.granted) { push({ role: "model", text: "Mikrofon izni verilmedi.", local: true }); return; }
    ExpoSpeechRecognitionModule.start({ lang: "tr-TR", interimResults: true, continuous: false });
  }

  const submit = () => { send(input); setInput(""); };

  return (
    <View style={s.root}>
      <StatusBar barStyle="light-content" backgroundColor="#05080f" />
      <View style={s.header}>
        <Text style={s.title}>ASENA</Text>
        <Pressable onPress={() => setShowSettings(true)}><Text style={s.link}>Ayarlar</Text></Pressable>
      </View>

      <ScrollView ref={scrollRef} style={{ flex: 1 }} contentContainerStyle={{ padding: 16, gap: 10 }}>
        {messages.length === 0 && <Text style={s.hint}>Mikrofona dokun ve konus.</Text>}
        {messages.map((m, i) => (
          <View key={i} style={[s.bubble, m.role === "user" ? s.user : s.model]}>
            <Text style={s.text}>{m.text}</Text>
            {!!m.via && <Text style={s.via}>{m.via}</Text>}
          </View>
        ))}
        {!!partial && <Text style={s.partial}>{partial}</Text>}
        {thinking && <ActivityIndicator color="#38bdf8" />}
      </ScrollView>

      <KeyboardAvoidingView behavior="height">
        <View style={s.bottom}>
          <Pressable onPress={toggleMic} style={[s.mic, listening && s.micOn]}>
            <Text style={s.micText}>{listening ? "Dinliyorum..." : "Konus"}</Text>
          </Pressable>
          <View style={s.row}>
            <TextInput style={s.input} value={input} onChangeText={setInput} placeholder="veya yaz..." placeholderTextColor="#64748b" onSubmitEditing={submit} />
            <Pressable style={s.sendBtn} onPress={submit}><Text style={s.text}>Gonder</Text></Pressable>
          </View>
        </View>
      </KeyboardAvoidingView>

      <Modal visible={showSettings} animationType="slide" onRequestClose={() => setShowSettings(false)}>
        <ScrollView style={s.root} contentContainerStyle={{ padding: 20, paddingTop: 48, gap: 12 }}>
          <Text style={s.title}>Ayarlar</Text>
          {providers.map((x) => (
            <View key={x.id} style={s.card}>
              <Text style={s.name}>{x.name}</Text>
              {x.needsKey && (
                <>
                  <TextInput style={s.input} value={x.apiKey} secureTextEntry autoCapitalize="none" placeholder="anahtarini yapistir" onChangeText={(v) => { const p = [...providers]; p[providers.indexOf(x)].apiKey = v; setProviders(p); }} />
                  {!!x.keyUrl && <Text style={s.link} onPress={() => require("react-native").Linking.openURL(x.keyUrl!)}>{x.keyUrl}</Text>}
                </>
              )}
              <TextInput style={s.input} value={x.model} autoCapitalize="none" placeholder="model adi" onChangeText={(v) => { const p = [...providers]; p[providers.indexOf(x)].model = v; setProviders(p); }} />
            </View>
          ))}
          <Pressable style={s.btn} onPress={() => { setProviders(p => [...p]); AsyncStorage.setItem(KEY, JSON.stringify({ providers, voice })); setShowSettings(false); }}>
            <Text style={s.text}>Kaydet</Text>
          </Pressable>
        </ScrollView>
      </Modal>
    </View>
  );
}

const s = StyleSheet.create({
  root: { flex: 1, backgroundColor: "#05080f" },
  header: { paddingTop: 48, paddingHorizontal: 20, paddingBottom: 12, flexDirection: "row", justifyContent: "space-between", alignItems: "center" },
  title: { color: "#38bdf8", fontSize: 26, fontWeight: "700" },
  link: { color: "#38bdf8", fontSize: 14 },
  hint: { color: "#64748b", textAlign: "center", marginTop: 20 },
  bubble: { padding: 12, borderRadius: 14, maxWidth: "85%" },
  user: { backgroundColor: "#1e293b", alignSelf: "flex-end" },
  model: { backgroundColor: "#0c4a6e", alignSelf: "flex-start" },
  text: { color: "#e2e8f0", fontSize: 16 },
  via: { color: "#7dd3fc", fontSize: 11, marginTop: 4 },
  partial: { color: "#7dd3fc", fontStyle: "italic", alignSelf: "flex-end" },
  bottom: { padding: 16, gap: 10 },
  mic: { backgroundColor: "#0369a1", paddingVertical: 18, borderRadius: 40, alignItems: "center" },
  micOn: { backgroundColor: "#dc2626" },
  micText: { color: "white", fontSize: 18, fontWeight: "600" },
  row: { flexDirection: "row", gap: 8 },
  input: { flex: 1, backgroundColor: "#0f172a", color: "#e2e8f0", borderRadius: 10, paddingHorizontal: 12, paddingVertical: 10 },
  sendBtn: { backgroundColor: "#1e293b", borderRadius: 10, paddingHorizontal: 14, justifyContent: "center" },
  card: { backgroundColor: "#0f172a", borderRadius: 12, padding: 12, gap: 8 },
  name: { color: "#e2e8f0", fontSize: 16, fontWeight: "600" },
  btn: { backgroundColor: "#1e293b", borderRadius: 10, padding: 12, alignItems: "center" },
});
ENDFILE

      - name: APK derle
        working-directory: asena
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/asena-v${{ github.run_number }}.apk"

      - name: Indirme sayfasina koy (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Asena v${{ github.run_number }}
          files: asena-v${{ github.run_number }}.apk
